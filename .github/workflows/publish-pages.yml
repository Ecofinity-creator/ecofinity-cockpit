name: Publiceer cockpit op GitHub Pages

# Draait automatisch bij elke push naar main die de cockpit-HTML wijzigt,
# en is ook handmatig te starten via het "Run workflow"-knopje.
on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/ecofinity-cockpit.html'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bouw de Pages-site (cockpit als index.html)
        run: |
          mkdir -p _site
          cp frontend/ecofinity-cockpit.html _site/index.html

      - name: Upload Pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
