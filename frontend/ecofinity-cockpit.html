<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Ecofinity — Order &amp; Project Cockpit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#1E2A32;
  --ink-soft:#57646D;
  --paper:#F2F0EA;
  --paper-raised:#FFFFFF;
  --line:#D9D5C9;
  --line-strong:#B9B4A6;
  --steel:#3E6E86;
  --steel-dark:#2C5064;
  --amber:#C9862E;
  --brick:#B54B3A;
  --moss:#5C7C5C;
  --slate:#8B939B;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, sans-serif;
  font-size:14px;
  line-height:1.5;
}
h1,h2,h3,h4{
  font-family:'Archivo', 'Arial Narrow', sans-serif;
  font-weight:800;
  letter-spacing:0.2px;
  margin:0;
  color:var(--ink);
}
.mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
.app{display:flex; min-height:100vh;}

/* ---------- rail ---------- */
.rail{
  width:216px; flex:0 0 216px;
  background:var(--ink);
  color:#EDEBE3;
  padding:22px 0 18px;
  display:flex; flex-direction:column;
}
.rail .brand{padding:0 20px 18px; border-bottom:1px solid rgba(255,255,255,0.14); margin-bottom:14px;}
.rail .brand .word{font-family:'Archivo'; font-weight:800; font-size:19px; letter-spacing:0.5px; color:#fff;}
.rail .brand .sub{font-family:'IBM Plex Mono'; font-size:10.5px; color:#A9B6BE; margin-top:4px; letter-spacing:0.4px;}
.rail .peildatum{padding:0 20px; margin-bottom:10px; font-family:'IBM Plex Mono'; font-size:10.5px; color:#94A3AB;}
.conn-badge{margin:0 20px 16px; padding:6px 9px; font-family:'IBM Plex Mono'; font-size:10px; letter-spacing:0.3px; border:1px solid rgba(255,255,255,0.16);}
.conn-badge.demo{color:#C9D2D6;}
.conn-badge.live{color:#8FE0C0; border-color:#3E8F6E; background:rgba(62,143,110,0.12);}
.conn-badge.error{color:#F0A794; border-color:#B54B3A; background:rgba(181,75,58,0.12);}
.rail nav{display:flex; flex-direction:column; gap:2px; flex:1;}
.rail button.navbtn{
  all:unset; cursor:pointer; display:flex; align-items:baseline; gap:10px;
  padding:9px 20px; font-size:13px; color:#C9D2D6; border-left:3px solid transparent;
}
.rail button.navbtn .n{font-family:'IBM Plex Mono'; font-size:11px; color:#7C8A92;}
.rail button.navbtn:hover{background:rgba(255,255,255,0.05); color:#fff;}
.rail button.navbtn.active{background:rgba(255,255,255,0.08); color:#fff; border-left-color:var(--steel);}
.rail button.navbtn.active .n{color:#8FC1D6;}
.rail .footnote{padding:14px 20px 0; font-size:10.5px; color:#7C8A92; border-top:1px solid rgba(255,255,255,0.1); margin-top:10px;}

/* ---------- main ---------- */
main{flex:1; padding:30px 38px 60px; max-width:1180px;}
.pagehead{margin-bottom:22px;}
.pagehead h1{font-size:22px;}
.pagehead .desc{color:var(--ink-soft); font-size:13px; margin-top:4px; max-width:640px;}

/* KPI grid */
.kpi-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:26px;}
.kpi{
  background:var(--paper-raised); border:1px solid var(--line); border-left:3px solid var(--slate);
  padding:12px 14px; cursor:pointer; text-align:left;
}
.kpi:hover{border-left-color:var(--steel); background:#FBFAF7;}
.kpi .num{font-family:'IBM Plex Mono'; font-weight:600; font-size:24px; line-height:1;}
.kpi .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
.kpi.flag{border-left-color:var(--brick);}
.kpi.flag .num{color:var(--brick);}

/* briefing */
.briefing{background:var(--paper-raised); border:1px solid var(--line); padding:16px 18px; margin-bottom:26px;}
.briefing h3{font-size:13px; text-transform:none; margin-bottom:10px;}
.briefing ul{margin:0; padding-left:0; list-style:none;}
.briefing li{padding:5px 0; border-top:1px solid var(--line); font-size:13px;}
.briefing li:first-child{border-top:none;}
.briefing li .q{color:var(--ink-soft); margin-right:6px;}
.briefing li b{font-family:'IBM Plex Mono'; font-weight:600;}

/* two column */
.cols{display:grid; grid-template-columns:1.4fr 1fr; gap:18px; align-items:start;}

/* table / ledger */
table.ledger{width:100%; border-collapse:collapse; background:var(--paper-raised); border:1px solid var(--line);}
table.ledger th{
  text-align:left; font-family:'IBM Plex Mono'; font-weight:500; font-size:10.5px; letter-spacing:0.3px;
  color:var(--ink-soft); padding:9px 10px; border-bottom:1px solid var(--line-strong); background:#F8F6F1;
}
table.ledger td{padding:10px 10px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top;}
table.ledger tr:last-child td{border-bottom:none;}
table.ledger tr.clickrow{cursor:pointer;}
table.ledger tr.clickrow:hover{background:#F8F6EF;}
.prio{font-family:'IBM Plex Mono'; color:var(--ink-soft);}
.cust{font-weight:600;}
.sub{color:var(--ink-soft); font-size:11.5px;}

.badge{display:inline-block; padding:2px 7px; font-size:11px; font-family:'IBM Plex Mono'; border:1px solid transparent;}
.badge.ok{color:var(--moss); border-color:var(--moss);}
.badge.warn{color:var(--amber); border-color:var(--amber);}
.badge.due{color:#fff; background:var(--amber);}
.badge.late{color:#fff; background:var(--brick);}
.badge.hold{color:var(--ink-soft); border-color:var(--slate); background:#EDEAE1;}
.badge.unknown{color:var(--steel-dark); border-color:var(--steel);}

.phase-pill{font-size:12px;}
.phase-pill .code{font-family:'IBM Plex Mono'; color:var(--ink-soft); margin-right:5px;}

/* planning queue */
.plan-list{background:var(--paper-raised); border:1px solid var(--line);}
.plan-row{display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer;}
.plan-row:hover{background:#F8F6EF;}
.plan-row:last-child{border-bottom:none;}
.plan-row .rank{font-family:'IBM Plex Mono'; font-size:20px; font-weight:600; color:var(--steel); width:28px;}
.plan-row .who{flex:1;}
.plan-row .who .name{font-weight:600;}
.plan-row .who .meta{font-size:11.5px; color:var(--ink-soft);}
.plan-row .days{font-family:'IBM Plex Mono'; font-size:12px; color:var(--ink-soft); text-align:right;}
.plan-skip{padding:10px 16px; font-size:12px; color:var(--ink-soft); border-top:1px dashed var(--line-strong); background:#F5F3EC;}
.plan-skip .row{display:flex; justify-content:space-between; padding:4px 0;}

/* kanban */
.kanban{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; align-items:start;}
.kcol{background:#EAE7DE; border:1px solid var(--line); min-height:120px;}
.kcol .khead{font-family:'IBM Plex Mono'; font-size:10.5px; font-weight:600; line-height:1.3; padding:9px 8px; border-bottom:2px solid var(--ink); background:#DEDACE;}
.kcol .kbody{padding:7px; display:flex; flex-direction:column; gap:7px;}
.kcard{background:var(--paper-raised); border:1px solid var(--line); border-left:3px solid var(--steel); padding:8px 9px; font-size:11.5px; cursor:pointer;}
.kcard:hover{border-left-color:var(--steel-dark); box-shadow:0 1px 0 var(--line-strong);}
.kcard.hold{border-left-color:var(--slate); opacity:0.75;}
.kcard.flag{border-left-color:var(--brick);}
.kcard .kc-name{font-weight:600; font-size:12px;}
.kcard .kc-type{color:var(--ink-soft); font-size:10.5px; margin:2px 0 6px;}
.kcard .kc-meta{font-family:'IBM Plex Mono'; font-size:10px; color:var(--ink-soft); display:flex; justify-content:space-between;}
.kcard .kc-flagline{margin-top:5px; font-size:10.5px; color:var(--brick);}

/* detail */
.backlink{all:unset; cursor:pointer; color:var(--steel-dark); font-size:12.5px; font-family:'IBM Plex Mono'; margin-bottom:14px; display:inline-block;}
.backlink:hover{text-decoration:underline;}
.detail-head{background:var(--paper-raised); border:1px solid var(--line); padding:20px 22px; margin-bottom:20px;}
.detail-head h2{font-size:20px;}
.detail-head .type{color:var(--ink-soft); font-size:13px; margin-top:2px;}
.detail-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line);}
.detail-grid .k{font-size:10.5px; font-family:'IBM Plex Mono'; color:var(--ink-soft); margin-bottom:4px;}
.detail-grid .v{font-size:15px; font-weight:600;}

.workoverview{width:100%; border-collapse:collapse; background:var(--paper-raised); border:1px solid var(--line);}
.workoverview th{text-align:left; font-family:'IBM Plex Sans'; font-weight:500; font-size:12.5px; color:var(--ink-soft); padding:12px 16px; border-bottom:1px solid var(--line); background:#F8F6F1;}
.workoverview td{padding:13px 16px; border-bottom:1px solid var(--line); font-size:13.5px;}
.workoverview tr:last-child td{border-bottom:none;}
.workoverview td.num, .workoverview th.num{text-align:right;}
.workoverview .phase-done{color:var(--ink-soft);}
.pill-klaar{display:inline-block; padding:3px 12px; border-radius:999px; background:#DCF3EF; color:#1E8F7E; font-size:12px; font-weight:600;}

.timeline{background:var(--paper-raised); border:1px solid var(--line); padding:6px 0;}
.tstep{display:flex; gap:14px; padding:14px 22px; border-bottom:1px solid var(--line); position:relative;}
.tstep:last-child{border-bottom:none;}
.tstep .mark{font-family:'IBM Plex Mono'; font-size:15px; width:20px; flex:0 0 20px; text-align:center; padding-top:1px;}
.tstep.done .mark{color:var(--moss);}
.tstep.current .mark{color:var(--steel);}
.tstep.todo .mark{color:var(--slate);}
.tstep .body{flex:1;}
.tstep .code{font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--ink-soft); margin-right:8px;}
.tstep .label{font-weight:600; font-size:13.5px;}
.tstep .info{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.tstep.current{background:#F4F8F9;}
.warnbox{margin-top:8px; padding:7px 10px; background:#FBEFE6; border:1px solid var(--amber); color:#7A4E1B; font-size:12px;}
.warnbox.crit{background:#FBEAE7; border-color:var(--brick); color:#7A2E22;}

.panel{background:var(--paper-raised); border:1px solid var(--line); padding:16px 18px;}
.panel h3{font-size:13px; margin-bottom:12px;}
.bottleneck-hero{border:1px solid var(--brick); background:#FBEAE7; padding:14px 16px; margin-bottom:18px;}
.bottleneck-hero .k{font-family:'IBM Plex Mono'; font-size:10.5px; color:#7A2E22; letter-spacing:0.3px;}
.bottleneck-hero h2{font-size:18px; color:#7A2E22; margin:4px 0 8px;}
.bottleneck-hero .stats{display:flex; gap:26px; font-size:12.5px; color:#7A2E22;}
.bottleneck-hero .stats b{font-family:'IBM Plex Mono'; font-size:15px; display:block;}

.durtable{width:100%; border-collapse:collapse;}
.durtable td{padding:8px 4px; border-bottom:1px solid var(--line); font-size:13px;}
.durtable td:last-child{text-align:right; font-family:'IBM Plex Mono'; font-weight:600;}
.durtable tr:last-child td{border-bottom:none;}
.durtable tr.hi td{color:var(--brick); font-weight:600;}

.bar-outer{background:#EAE7DE; height:6px; margin-top:4px;}
.bar-inner{background:var(--steel); height:6px;}
.bar-inner.hi{background:var(--brick);}

/* settings */
.map-table{width:100%; border-collapse:collapse; background:var(--paper-raised); border:1px solid var(--line);}
.map-table th{text-align:left; font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--ink-soft); padding:9px 12px; border-bottom:1px solid var(--line-strong); background:#F8F6F1;}
.map-table td{padding:10px 12px; border-bottom:1px solid var(--line); font-size:13px;}
.map-table tr:last-child td{border-bottom:none;}
.map-table .arrow{color:var(--slate); margin:0 8px;}
.unmapped-row td{background:#FBF3E4;}
.pill-btn{all:unset; font-family:'IBM Plex Mono'; font-size:11px; padding:4px 10px; border:1px solid var(--steel); color:var(--steel-dark); cursor:pointer;}
.pill-btn:hover{background:var(--steel); color:#fff;}

.section-title{font-family:'IBM Plex Mono'; font-size:11px; color:var(--ink-soft); letter-spacing:0.4px; margin:26px 0 10px;}
.section-title:first-child{margin-top:0;}

@media (max-width: 980px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .cols{grid-template-columns:1fr;}
  .kanban{grid-template-columns:repeat(4,1fr);}
  .detail-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

/* ============================================================
   FASE-DERIVATIE — deriveCurrentProjectPhase(project)
   Regel 1: doorloop de 7 fasen in vaste volgorde.
   Regel 2: volledig afgewerkte fasen = voltooid.
   Regel 3: eerste niet-voltooide fase = actuele fase.
   Regel 4: als Teamleader expliciet een latere fase actief meldt, gebruik die.
   Regel 5: bij inconsistentie: NIET stilzwijgend corrigeren — flaggen.
   ============================================================ */
function deriveCurrentProjectPhase(pr){
  if(pr.missingProject || pr.unknownPhase) return; // buiten de 7-fasenlogica, apart behandeld
  const seqIdx = PHASES.findIndex(ph => !(pr.history && pr.history[ph.code] && pr.history[ph.code].done));
  if(seqIdx === -1){ pr.currentPhaseCode='07'; pr.closed=true; return; } // Regel 2: alles voltooid
  const seqCode = PHASES[seqIdx].code; // Regel 3

  const explicit = pr.teamleaderActivePhase; // wat Teamleader zelf als actief meldt
  if(explicit && explicit !== seqCode && phaseIdx(explicit) > seqIdx){
    // Regel 4 + Regel 5: latere fase is actief terwijl een eerdere fase niet is afgevinkt
    pr.currentPhaseCode = explicit;
    pr.closed = false;
    pr.dataIssue = pr.dataIssue || `${phaseByCode(seqCode).label} staat niet als afgerond in Teamleader, terwijl ${phaseByCode(explicit).label} al actief staat.`;
    return;
  }
  pr.currentPhaseCode = seqCode;
  pr.closed = false;
}
FALLBACK_PROJECTS.forEach(deriveCurrentProjectPhase);

let DURATION_STATS = FALLBACK_DURATION_STATS;

/* configureerbare grenswaarden voor deadline-alerts (sectie 9) */
let CONFIG = { attentionThresholdDays: 7 };

/* ============================================================
   HELPERS
   ============================================================ */
function activePhase(pr){
  if(pr.missingProject) return null;
  if(pr.unknownPhase) return null;
  return phaseByCode(pr.currentPhaseCode);
}
function daysInPhase(pr){ return daysBetween(pd(pr.phaseEnteredDate), REF_DATE); }
function daysSinceOrder(pr){ return daysBetween(pd(pr.dealClosedAt), REF_DATE); }

function deadlineStatus(pr){
  const dl = pr.deadlines && pr.deadlines[pr.currentPhaseCode];
  if(!dl) return null;
  const diff = daysBetween(REF_DATE, pd(dl));
  const T = CONFIG.attentionThresholdDays;
  if(diff>T)  return {cls:'ok',   text:'Normaal',                                    diff};
  if(diff>0)  return {cls:'warn', text:`Aandacht — nog ${diff} d.`,                   diff};
  if(diff===0)return {cls:'due',  text:'Dringend — vandaag',                          diff};
  return         {cls:'late', text:`Te laat — ${Math.abs(diff)} d. overschreden`, diff};
}
function hasIssue(pr){
  return !!(pr.hold || pr.dataIssue || pr.unknownPhase || pr.missingProject ||
    (pr.currentPhaseCode==='05' && !pr.installation));
}
function phaseLabelOf(pr){
  if(pr.missingProject) return 'Geen Teamleader-project gekoppeld';
  if(pr.unknownPhase) return pr.unknownPhase;
  const ph = phaseByCode(pr.currentPhaseCode);
  return ph ? ph.label : '—';
}
function activeProjects(){ return PROJECTS.filter(p=>!p.closed); }

/* ============================================================
   LIVE TEAMLEADER-KOPPELING
   Verbindt met de backend uit /ecofinity-integration (zie README daar). Bij succes vervangen
   we de demo-mockdata door de echte Teamleader-data; bij falen blijft alles gewoon in
   demo-modus staan. Er wordt hier bewust NIETS automatisch geprobeerd bij het opstarten:
   de backend draait niet op hetzelfde adres voor iedereen, dus de gebruiker verbindt zelf
   via de instellingenpagina.
   ============================================================ */
function mapLiveProject(item){
  return {
    id: item.dealId,
    dealId: item.dealId,
    projectId: item.projectId,
    priority: item.priority,
    customer: item.customer,
    type: item.type,
    dealClosedAt: item.dealClosedAt,
    phaseEnteredDate: item.phaseEnteredDate,
    history: item.history || {},
    deadlines: item.deadlines || {},
    workOverview: item.workOverview || {},
    installation: item.installation || null,
    hold: item.hold || null,
    missingProject: !!item.missingProject,
    currentPhaseCode: item.currentPhaseCode,
    closed: !!item.closed,
    dataIssue: item.dataIssue || null,
    unknownPhase: item.unknownPhaseLabel || null,
  };
}

async function connectToBackend(rawUrl){
  const url = rawUrl.replace(/\/+$/,'');
  state.connectionError = null;
  try{
    const res = await fetch(url + '/api/cockpit-data');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    PROJECTS = (data.projects || []).map(mapLiveProject);
    DURATION_STATS = data.durationStats || FALLBACK_DURATION_STATS;
    CONFIG.attentionThresholdDays = (data.config && data.config.attentionThresholdDays) || CONFIG.attentionThresholdDays;
    state.apiBase = url;
    state.connected = true;
  }catch(err){
    state.connected = false;
    state.connectionError = err.message || 'Onbekende fout bij verbinden.';
  }
  render();
}

function disconnectFromBackend(){
  PROJECTS = FALLBACK_PROJECTS;
  DURATION_STATS = FALLBACK_DURATION_STATS;
  CONFIG.attentionThresholdDays = 7;
  state.apiBase = '';
  state.connected = false;
  state.connectionError = null;
  render();
}

      <div style="display:flex; align-items:center; gap:12px; font-size:13px; color:var(--ink-soft);">
        Toon status <span class="badge warn" style="margin:0 2px;">Aandacht</span> wanneer de opleverdatum van de actieve fase binnen
        <input type="number" id="thresholdInput" value="${CONFIG.attentionThresholdDays}" min="1" max="30"
          style="width:52px; font-family:'IBM Plex Mono'; font-size:13px; padding:4px 6px; border:1px solid var(--line-strong); text-align:center;">
        dagen valt.
      </div>
      <div style="font-size:11.5px; color:var(--slate); margin-top:8px;">Wijzigingen worden meteen toegepast op dashboard, wachtrij en kanban.${state.connected ? ' Bij een live koppeling wordt dit ook op de backend bewaard.' : ''}</div>
    </div>
  `;
}

/* ============================================================
   VIEW: PROJECT DETAIL
   ============================================================ */
function viewDetail(){
  const p = PROJECTS.find(x=>x.id===state.selectedId);
  if(!p) return `<div class="pagehead"><h1>Project niet gevonden</h1></div>`;
  const st = deadlineStatus(p);

  const warnings = [];
  if(p.missingProject) warnings.push({crit:true, text:`Deal ${p.dealId} is gewonnen op ${fmt(p.dealClosedAt)}, maar er is nog geen gekoppeld Teamleader-project. De planningswachtrij en projectfasen kunnen pas gevuld worden zodra de koppeling deal → project gemaakt is.`});
  if(p.unknownPhase) warnings.push({crit:false, text:`Onbekende projectfase in Teamleader: "${p.unknownPhase}". Fase wordt getoond zoals ze in Teamleader staat, niet genegeerd.`});
  if(p.dataIssue) warnings.push({crit:true, text:'Projectfasen lijken inconsistent: '+p.dataIssue});
  if(p.hold) warnings.push({crit:false, text:`On hold — ${p.hold.reason}: ${p.hold.note}`});
  if(p.currentPhaseCode==='05' && !p.installation) warnings.push({crit:true, text:'Uitvoering staat als ingepland, maar er werd geen planningsafspraak gevonden.'});

  return `
    <button class="backlink" data-back>← Terug naar wachtrij</button>
    <div class="detail-head">
      <h2>${p.customer.toUpperCase()}</h2>
      <div class="type">${p.type}</div>
      <div class="detail-grid">
        <div><div class="k">DEAL</div><div class="v" style="font-size:13px;">${p.dealId}<div class="sub" style="font-weight:400;">gewonnen ${fmt(p.dealClosedAt)}</div></div></div>
        <div><div class="k">GEKOPPELD PROJECT</div><div class="v" style="font-size:13px;">${p.projectId ? p.projectId : '⚠ geen koppeling'}</div></div>
        <div><div class="k">BESTELPRIORITEIT</div><div class="v">#${String(p.priority).padStart(3,'0')}</div></div>
        <div><div class="k">HUIDIGE FASE</div><div class="v">${phaseLabelOf(p)}${p.currentPhaseCode ? `<div class="sub" style="font-weight:400;">${daysInPhase(p)} dagen in fase</div>` : ''}</div></div>
      </div>
    </div>
    ${warnings.map(w=>`<div class="warnbox ${w.crit?'crit':''}">⚠ ${w.text}</div>`).join('')}
    ${p.installation ? `
      <div class="panel" style="margin-bottom:18px;">
        <h3>Uitvoeringsafspraak</h3>
        <div class="detail-grid" style="grid-template-columns:repeat(4,1fr); border:none; margin:0; padding:0;">
          <div><div class="k">INSTALLATIEDATUM</div><div class="v">${fmt(p.installation.date)}</div></div>
          <div><div class="k">START</div><div class="v">${p.installation.start}</div></div>
          <div><div class="k">EINDE</div><div class="v">${p.installation.end}</div></div>
          <div><div class="k">TEAM</div><div class="v" style="font-size:13px;">${p.installation.team}</div></div>
        </div>
      </div>` : ''}
    <div class="section-title">WERKOVERZICHT (RECHTSTREEKS UIT TEAMLEADER)</div>
    ${renderWorkOverview(p)}

    <div class="section-title">PROJECTVERLOOP</div>
    <div class="timeline">
      ${PHASES.map(ph=>{
        const hist = p.history && p.history[ph.code];
        const isCurrent = p.currentPhaseCode===ph.code;
        const done = hist && hist.done;
        const cls = done ? 'done' : (isCurrent ? 'current' : 'todo');
        const mark = done ? '✓' : (isCurrent ? '●' : '○');
        let info = '';
        if(done) info = `klaar ${fmt(hist.date)}`;
        else if(isCurrent) info = `${daysInPhase(p)} dagen actief${p.deadlines[ph.code] ? ' · deadline '+fmt(p.deadlines[ph.code]) : ''}`;
        else if(p.deadlines[ph.code]) info = `deadline ${fmt(p.deadlines[ph.code])}`;
        return `
        <div class="tstep ${cls}">
          <div class="mark">${mark}</div>
          <div class="body">
            <span class="code">${ph.code}</span><span class="label">${ph.label}</span>
            ${info ? `<div class="info">${info}</div>` : ''}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderWorkOverview(p){
  return `
  <table class="workoverview" style="margin-bottom:24px;">
    <thead><tr><th>Fase</th><th class="num">Geregistreerde tijd</th><th class="num">Geschatte tijd</th><th class="num">Opleverdatum</th></tr></thead>
    <tbody>
      ${PHASES.map(ph=>{
        const hist = p.history && p.history[ph.code];
        const done = hist && hist.done;
        const wo = (p.workOverview && p.workOverview[ph.code]) || {reg:'-', est:'-'};
        const oplever = done ? `<span class="pill-klaar">Klaar</span>` : (p.deadlines[ph.code] ? fmt(p.deadlines[ph.code]) : '—');
        return `<tr>
          <td class="${done?'phase-done':''}">${ph.label}</td>
          <td class="num">${wo.reg}</td>
          <td class="num">${wo.est}</td>
          <td class="num">${oplever}</td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
function render(){
  renderNav();
  renderConnectionBadge();
  const main = document.getElementById('main');
  let html = '';
  switch(state.view){
    case 'dashboard': html = viewDashboard(); break;
    case 'queue': html = viewQueue(); break;
    case 'planning': html = viewPlanning(); break;
    case 'kanban': html = viewKanban(); break;
    case 'duration': html = viewDuration(); break;
    case 'settings': html = viewSettings(); break;
    case 'detail': html = viewDetail(); break;
    default: html = viewDashboard();
  }
  main.innerHTML = html;

  main.querySelectorAll('[data-kpi]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const f = JSON.parse(el.dataset.kpi);
      goTo('queue', f);
    });
  });
  main.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> openProject(el.dataset.open));
  });
  const back = main.querySelector('[data-back]');
  if(back) back.addEventListener('click', ()=> goTo('queue', state.filter));
  const clear = main.querySelector('[data-clearfilter]');
  if(clear) clear.addEventListener('click', (e)=>{ e.stopPropagation(); goTo('queue', null); });

  const search = main.querySelector('#searchInput');
  if(search){
    search.addEventListener('input', ()=>{ state.search = search.value; render(); search2Focus(); });
  }
  const closedToggle = main.querySelector('#showClosedToggle');
  if(closedToggle) closedToggle.addEventListener('change', ()=>{ state.showClosed = closedToggle.checked; render(); });

  const thresholdInput = main.querySelector('#thresholdInput');
  if(thresholdInput){
    thresholdInput.addEventListener('change', async ()=>{
      const v = parseInt(thresholdInput.value,10);
      if(!(v>0 && v<=30)) return render();
      CONFIG.attentionThresholdDays = v;
      if(state.connected){
        try{
          await fetch(state.apiBase + '/api/settings/deadline-threshold', {
            method:'PUT', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ attentionThresholdDays: v })
          });
        }catch(err){ /* UI blijft lokaal consistent; volgende sync trekt gelijk */ }
      }
      render();
    });
  }

  const connectBtn = main.querySelector('[data-connect]');
  if(connectBtn){
    connectBtn.addEventListener('click', ()=>{
      const url = main.querySelector('#backendUrlInput').value.trim();
      if(url) connectToBackend(url);
    });
  }
  const disconnectBtn = main.querySelector('[data-disconnect]');
  if(disconnectBtn) disconnectBtn.addEventListener('click', disconnectFromBackend);

  main.querySelectorAll('[data-map-phase]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const alias = btn.dataset.mapPhase;
      const list = PHASES.map(p=>`${p.code} = ${p.label}`).join('\n');
      const code = prompt(`Aan welke fasecode moet "${alias}" gekoppeld worden?\n\n${list}\n\nVul de code in (bv. 07):`);
      if(!code) return;
      const trimmed = code.trim();
      if(!PHASES.some(p=>p.code===trimmed)){ alert('Ongeldige fasecode.'); return; }
      try{
        await fetch(state.apiBase + '/api/settings/phase-mapping', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ alias, code: trimmed })
        });
        await connectToBackend(state.apiBase); // haalt de nu opgeloste fase opnieuw op
      }catch(err){
        alert('Kon de koppeling niet opslaan: ' + err.message);
      }
    });
  });
}

function renderConnectionBadge(){
  const el = document.getElementById('connectionBadge');
  if(!el) return;
  if(state.connected){
    el.className = 'conn-badge live';
    el.textContent = '● LIVE — Teamleader';
  } else if(state.connectionError){
    el.className = 'conn-badge error';
    el.textContent = '⚠ VERBINDING MISLUKT';
  } else {
    el.className = 'conn-badge demo';
    el.textContent = '○ DEMO-MODUS (mockdata)';
  }
}

/* houdt focus + cursorpositie in de zoekbalk vast na elke render */
function search2Focus(){
  const el = document.getElementById('searchInput');
  if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
}

render();
</script>
</body>
</html>
